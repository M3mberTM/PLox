[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plox"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
plox = "lox.lox:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff.lint]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105"]